<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="stylesheet" href="style.css"><title>تخصيص التعلم</title></head>
<body><main class="app screen"><div class="page-shell"><div class="topbar"><button class="icon-btn" type="button" onclick="history.back()" aria-label="رجوع">‹</button></div><div class="center-head"><div class="eyebrow">PERSONALIZE</div><h1>خلينا نخصص تجربتك</h1><p>اختياراتك هتساعدنا نجهز لك كروت أقرب لاحتياجك.</p></div><div class="card fade-up"><section class="goal-section"><h2>1. بتتعلم اللغة ليه؟</h2><div class="goal-grid" data-group="purpose"><button class="small-choice" type="button">شغل</button><button class="small-choice" type="button">سفر</button><button class="small-choice" type="button">دراسة</button><button class="small-choice" type="button">محادثات يومية</button></div></section><section class="goal-section"><h2>2. مستواك الحالي</h2><div class="goal-grid" data-group="level"><button class="small-choice" type="button">مبتدئ</button><button class="small-choice" type="button">متوسط</button><button class="small-choice" type="button">متقدم</button></div></section><section class="goal-section"><h2>3. تحب تذاكر إيه؟</h2><div class="goal-grid" data-group="topics"><button class="small-choice" type="button">كلمات</button><button class="small-choice" type="button">جمل</button><button class="small-choice" type="button">أفعال</button><button class="small-choice" type="button">مصطلحات</button></div></section><section class="goal-section"><h2>4. الوقت المتاح يوميًا</h2><div class="goal-grid" data-group="time"><button class="small-choice" type="button">5 دقائق</button><button class="small-choice" type="button">10 دقائق</button><button class="small-choice" type="button">20 دقيقة</button></div></section></div><div class="actions"><button class="primary" type="button" onclick="finish()">ابدأ التعلم</button></div></div></main><script src="../assets/scripts/storage.js"></script><script src="script.js"></script></body></html>
