<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="stylesheet" href="style.css"><title>إنشاء حساب</title></head>
<body><main class="app screen"><div class="page-shell"><div class="topbar"><button class="icon-btn" type="button" onclick="history.back()" aria-label="رجوع">‹</button></div><div class="center-head"><div class="eyebrow">CREATE YOUR ACCOUNT</div><h1>أنشئ حسابك</h1><p>خلينا نتعرف عليك.</p></div><div class="card fade-up"><div class="stack"><div class="field"><label>الاسم</label><div class="row"><input id="first" class="input" placeholder="الاسم الأول"><input id="last" class="input" placeholder="اسم العائلة"></div></div><div class="field"><label>تاريخ الميلاد</label><div class="row"><select id="year" class="input"><option value="">السنة</option><option>2000</option><option>2001</option><option>2002</option></select><select id="month" class="input"><option value="">الشهر</option><option>1</option><option>2</option><option>3</option></select><select id="day" class="input"><option value="">اليوم</option><option>15</option><option>20</option></select></div></div><div class="field"><label>البلد</label><div class="row"><input id="city" class="input" placeholder="المدينة"><select id="country" class="input"><option>مصر</option><option>السعودية</option></select></div></div><div class="field"><label>النوع</label><select id="gender" class="input"><option value="">اختر النوع</option><option>ذكر</option><option>أنثى</option></select></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" class="input" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" class="input" placeholder="••••••••"></div></div></div><div class="actions"><button class="primary" type="button" onclick="submitRegister()">التالي</button><a class="link" href="../login/index.html">لديك حساب بالفعل؟ تسجيل الدخول</a></div></div></main><script src="../assets/scripts/storage.js"></script><script src="script.js"></script></body></html>
